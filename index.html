<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Website</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Thanh điều hướng -->
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="index.html" class="logo">TIN TỨC</a>

                <ul id="categoryMenu" class="nav-menu">
                    <!-- Danh mục sẽ được JavaScript tải vào đây -->
                </ul>
            </div>
        </nav>
    </header>

    <!-- Nội dung chính -->
    <main class="container">

        <section class="news-section">
            <h1>Tin tức mới nhất</h1>

            <div id="featuredPosts" class="featured-posts">
                <!-- 3 bài mới nhất sẽ hiển thị ở đây -->
            </div>

            <div id="postList" class="post-list">
                <!-- Các bài viết còn lại sẽ hiển thị ở đây -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content">

            <div>
                <h3>Tin tức</h3>
                <p>Website tin tức tổng hợp.</p>
            </div>

            <div>
                <h3>Liên kết nhanh</h3>
                <a href="index.html">Trang chủ</a>
                <a href="#">Tin mới</a>
                <a href="#">Liên hệ</a>
            </div>

            <div>
                <h3>Liên hệ</h3>
                <p>Email: contact@example.com</p>
                <p>Địa chỉ: Hà Nội, Việt Nam</p>
            </div>

            <div>
                <h3>Mạng xã hội</h3>
                <a href="#">Facebook</a>
                <a href="#">YouTube</a>
                <a href="#">TikTok</a>
            </div>

        </div>

        <div class="copyright">
            © 2026 News Website. All rights reserved.
        </div>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
