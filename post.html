<!DOCTYPE html>
<html lang="vi">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chi tiết bài viết - Tin tức</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- THANH ĐIỀU HƯỚNG -->
    <header>

        <nav class="navbar">

            <div class="container">

                <a href="index.html" class="logo">
                    TIN TỨC
                </a>

                <ul id="categoryMenu" class="nav-menu">
                    <!-- JavaScript tải danh mục -->
                </ul>

            </div>

        </nav>

    </header>


    <!-- NỘI DUNG BÀI VIẾT -->
    <main class="container">

        <article id="postDetail" class="post-detail">

            <!-- JavaScript sẽ đưa bài viết vào đây -->

            <p>Đang tải bài viết...</p>

        </article>

    </main>


    <!-- FOOTER -->

        <div class="container footer-content">

            <div>

                <h3>Tin tức</h3>

                <p>
                    Website tin tức tổng hợp.
                </p>

            </div>


            <div>

                <h3>Liên kết nhanh</h3>

                <a href="index.html">
                    Trang chủ
                </a>

                <a href="index.html">
                    Tin mới
                </a>

                <a href="#">

                </a>

            </div>


            <div>

                <h3>Danh mục</h3>

                <div id="footerCategories">
                    <!-- JavaScript tải danh mục -->
                </div>

            </div>


            <div>

                <h3>Liên hệ</h3>

                <p>
                    Email: contact@example.com
                </p>

                <p>
                    Địa chỉ: Hà Nội, Việt Nam
                </p>

            </div>

        </div>


        <div class="copyright">

            © 2026 News Website.
            All rights reserved.

        </div>

    <!-- JAVASCRIPT -->

    <script src="js/app.js"></script>
