<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Crawler Bài Viết</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="navbar container">
      <ul class="nav-list" id="categories-menu"></ul>
    </nav>
  </header>

  <main class="container" style="margin-top:30px; background:#fff; padding:30px; border-radius:6px; max-width:800px;">
    <h2 style="color:#b70000; margin-bottom:15px;">Công Cụ Crawl Tin Tức Dân Trí</h2>
    <p style="margin-bottom:15px; color:#555;">Dán đường dẫn bài viết Dân trí vào ô bên dưới để cào dữ liệu lưu vào LocalStorage:</p>

    <div style="display:flex; gap:10px; margin-bottom:20px;">
      <input type="text" id="crawl-url" placeholder="https://dantri.com.vn/..." style="flex:1; padding:10px; border:1px solid #ccc; border-radius:4px;">
      <button onclick="startCrawl()" style="padding:10px 20px; background:#b70000; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">Cào Tin</button>
    </div>

    <div id="status-msg" style="margin-bottom:15px; font-weight:bold;"></div>
    <pre id="json-output" style="background:#111; color:#00ff00; padding:15px; border-radius:6px; overflow-x:auto; min-height:150px; font-size:13px;"></pre>
  </main>

  <script src="js/app.js"></script>
  <script src="js/crawler.js"></script>
</body>
</html>
