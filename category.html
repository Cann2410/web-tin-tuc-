<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danh mục - Tin tức</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- THANH ĐIỀU HƯỚNG -->
    <header>
        <nav class="navbar">
            <div class="container">

                <a href="index.html" class="logo">
                    TIN TỨC
                </a>

                <ul id="categoryMenu" class="nav-menu">
                    <!-- JavaScript sẽ tải danh mục vào đây -->
                </ul>

            </div>
        </nav>
    </header>


    <!-- NỘI DUNG DANH MỤC -->
    <main class="container">

        <section class="category-section">

            <!-- Tên danh mục -->
            <h1 id="categoryTitle">
                Danh mục
            </h1>


            <!-- 3 BÀI MỚI NHẤT -->
            <div id="topPosts" class="top-posts">

                <!--
                    JavaScript sẽ tạo:
                    1 bài lớn bên trái
                    2 bài nhỏ bên phải
                -->

            </div>


            <!-- CÁC BÀI CÒN LẠI -->
            <div class="remaining-section">

                <h2>Bài viết mới nhất</h2>

                <div id="categoryPostList" class="post-list">

                    <!-- JavaScript sẽ đưa các bài còn lại vào đây -->

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="container footer-content">

            <div>
                <h3>Tin tức</h3>

                <p>
                    Website tin tức tổng hợp.
                </p>
            </div>


            <div>
                <h3>Liên kết nhanh</h3>

                <a href="index.html">
                    Trang chủ
                </a>

                <a href="index.html">
                    Tin mới
                </a>

                <a href="#">
                    Liên hệ
                </a>
            </div>


            <div>
                <h3>Danh mục</h3>

                <div id="footerCategories">
                    <!-- JavaScript tải danh mục -->
                </div>

            </div>


            <div>
                <h3>Liên hệ</h3>

                <p>
                    Email: contact@example.com
                </p>

                <p>
                    Địa chỉ: Hà Nội, Việt Nam
                </p>

            </div>

        </div>


        <div class="copyright">

            © 2026 News Website.
            All rights reserved.

        </div>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="js/app.js"></script>

    <script src="js/category.js"></script>

</body>
</html>
